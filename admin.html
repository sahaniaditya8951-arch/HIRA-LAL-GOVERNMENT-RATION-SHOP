<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer Control Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

    <!-- LOGIN BOX -->
    <div id="loginSection" class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
        <div class="text-center mb-6">
            <i class="fa-solid fa-user-shield text-4xl text-purple-600 mb-2"></i>
            <h2 class="text-xl font-bold text-slate-800">कोटेदार लॉगिन (Dealer Auth)</h2>
            <p class="text-xs text-slate-400 mt-1">आगे बढ़ने के लिए अपना गुप्त पिन दर्ज करें</p>
        </div>
        <div class="space-y-4">
            <input type="password" id="dealerPassword" placeholder="सिक्योरिटी पासवर्ड डालें" class="w-full px-4 py-3 border border-slate-200 rounded-xl text-center text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-purple-500">
            <button onclick="verifyDealer()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl font-semibold transition cursor-pointer shadow-lg shadow-purple-100">
                लॉगिन करें
            </button>
        </div>
    </div>

    <!-- MAIN ADMIN PANEL (Hidden Initially) -->
    <div id="adminPanelSection" class="bg-white p-6 rounded-2xl shadow-md w-full max-w-2xl hidden space-y-6">
        <div class="flex justify-between items-center border-b border-slate-100 pb-4">
            <div class="flex items-center gap-2 text-purple-600">
                <i class="fa-solid fa-toolbox text-xl"></i>
                <h2 class="text-lg font-bold text-slate-800">कोटेदार डैशबोर्ड (Admin Only)</h2>
            </div>
            <button onclick="logoutAdmin()" class="text-xs font-bold text-rose-500 hover:text-rose-700 bg-rose-50 px-3 py-1.5 rounded-lg transition cursor-pointer">
                लॉगआउट करें
            </button>
        </div>

        <!-- Entry Form -->
        <div class="space-y-4">
            <h3 class="text-sm font-semibold text-slate-600"><i class="fa-solid fa-plus mr-1"></i> नया राशन वितरण दर्ज करें</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input type="text" id="adminCardNo" placeholder="उपभोक्ता का राशन कार्ड नंबर" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm">
                <input type="number" id="adminQty" placeholder="कुल मात्रा (Kg) उदा. 35" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm">
            </div>
            <button onclick="markAsDistributed()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-sm font-semibold transition shadow-md cursor-pointer">
                <i class="fa-solid fa-check-double mr-1"></i> डेटाबेस में सुरक्षित करें
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://ration-admin-68b62-default-rtdb.firebaseio.com", projectId: "ration-admin-68b62" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Password Configuration
        const CORRECT_PASSWORD = "8951"; // <--- APNA PASSWORD YAHAN BADLEIN

        function verifyDealer() {
            const enteredPass = document.getElementById('dealerPassword').value;
            if(enteredPass === CORRECT_PASSWORD) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminPanelSection').classList.remove('hidden');
                document.body.classList.replace('bg-slate-100', 'bg-slate-50');
            } else {
                alert("गलत पासवर्ड! कृपया सही पिन डालें।");
            }
        }

        function logoutAdmin() {
            document.getElementById('dealerPassword').value = "";
            document.getElementById('adminPanelSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.body.classList.replace('bg-slate-50', 'bg-slate-100');
        }

        function markAsDistributed() {
            const cardNo = document.getElementById('adminCardNo').value.trim();
            const qty = document.getElementById('adminQty').value.trim();

            if(!cardNo || !qty) { alert("कृपया कार्ड नंबर और मात्रा दोनों भरें!"); return; }

            database.ref('RationCards/' + cardNo).once('value').then(snapshot => {
                if(snapshot.exists()) {
                    const newHistoryRef = database.ref('RationHistory/' + cardNo).push();
                    newHistoryRef.set({
                        date: new Date().toLocaleDateString('hi-IN'),
                        quantity: qty,
                        status: "प्राप्त किया (Le Gaye)"
                    }).then(() => {
                        alert("वितरण डेटा सफलतापूर्वक लाइव सेव हो गया!");
                        document.getElementById('adminCardNo').value = ""; document.getElementById('adminQty').value = "";
                    });
                } else { alert("यह कार्ड नंबर पंजीकृत नहीं है! कृपया पहले पब्लिक पेज पर इसका रजिस्ट्रेशन करें।"); }
            });
        }
    </script>
</body>
</html>
